<!DOCTYPE html>
<html lang="fr">
<head>

<style>
html,
body {

}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

main {
    line-height: 1.8;
}

h1 {

}

    margin: 0;
    font-size: 1rem;

.spacer {

a {
    color: #fff;
    text-decoration: none;
}

}

<body>

<main>

    <p>Paris</p>

    <div class="spacer"></div>

    <p>Vendredis 19h00</p>
    <p>Samedis 17h00</p>

    <div class="spacer"></div>

    <p>
        <a href="mailto:atelier@nouveaunom.fr">

        </a>
    </p>

</body>
</html>
